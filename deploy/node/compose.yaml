name: ${COMPOSE_PROJECT_NAME:-vaultwarden-node}

services:
  mariadb:
    image: mariadb:${MARIADB_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME:-vaultwarden-node}-mariadb
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${WIREGUARD_IP}:3306:3306"
    volumes:
      - ./data/mariadb:/var/lib/mysql
      - ./config/mariadb/50-server.cnf:/etc/mysql/mariadb.conf.d/60-vaultwarden-replication.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      backend:
        ipv4_address: 172.30.10.2

  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME:-vaultwarden-node}-vaultwarden
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      DOMAIN: ${DOMAIN}
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      SIGNUPS_ALLOWED: ${SIGNUPS_ALLOWED}
      INVITATIONS_ALLOWED: ${INVITATIONS_ALLOWED}
      SHOW_PASSWORD_HINT: ${SHOW_PASSWORD_HINT}
      LOG_LEVEL: ${LOG_LEVEL}
      EXTENDED_LOGGING: ${EXTENDED_LOGGING}
    ports:
      - "${WIREGUARD_IP}:8080:80"
    volumes:
      - ./data/vaultwarden:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:80/alive"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      backend:
        ipv4_address: 172.30.10.3

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
          gateway: 172.30.10.1
