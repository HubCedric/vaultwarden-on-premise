# Source : compose identique observé sur bitwarden-master et bitwarden-slave.
# Transformation de publication : secrets déplacés vers .env, domaine anonymisé.
services:
  vaultwarden:
    image: "vaultwarden/server:${VAULTWARDEN_VERSION:-1.37.1}"
    container_name: vaultwarden
    restart: always
    ports:
      - "443:80"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      ROCKET_TLS: '{certs="/ssl/certs.pem",key="/ssl/key.pem"}'
      DOMAIN: "https://vaultwarden.example.com"
    volumes:
      - /vw-data:/data
      - /ssl/keys/:/ssl/

